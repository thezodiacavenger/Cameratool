name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the exe to a GitHub Release on version tags

jobs:
  usb-stress:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install comtypes
      - name: Stress the USB path (native crashes are dumped)
        shell: pwsh
        run: |
          python tools/usb_stress.py
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $log = (Get-Content usb_stress.log -Raw) -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=usb stress crash (exit $code)::$log"
            exit 1
          }

  build:
    needs: usb-stress
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller comtypes pillow openpyxl python-docx

      - name: Unit tests
        run: python tools/ci_tests.py

      - name: Pre-generate Windows Portable Devices wrappers
        run: python -c "import comtypes.client as c; c.GetModule('portabledeviceapi.dll'); c.GetModule('portabledevicetypes.dll'); import comtypes.gen.PortableDeviceApiLib, comtypes.gen.PortableDeviceTypesLib; print('WPD wrappers OK')"

      - name: Generate icon and version info (Emmet Adriaans / Created for Vistek Ltd.)
        run: python tools/make_build_files.py

      - name: Build CameraCheck.exe
        run: >
          pyinstaller --noconfirm --name CameraCheck --windowed
          --icon build/CameraCheck.ico --version-file build/version_info.txt
          --collect-submodules comtypes
          --add-data "camcheck/web;camcheck/web"
          --add-data "camcheck/data;camcheck/data"
          CameraCheck.py

      - name: Bundle ExifTool (exiftool.org, Phil Harvey)
        shell: pwsh
        run: |
          function Fetch($url, $out) {
            for ($i = 1; $i -le 5; $i++) {
              try { Invoke-WebRequest -UseBasicParsing -UserAgent "Wget" $url -OutFile $out; if ((Get-Item $out).Length -gt 100000) { return } }
              catch { Write-Host "attempt $i failed: $_" }
              Start-Sleep -Seconds (5 * $i)
            }
            throw "download failed: $url"
          }
          $ver = $null
          for ($i = 1; $i -le 5 -and -not $ver; $i++) {
            try { $ver = (Invoke-WebRequest -UseBasicParsing "https://exiftool.org/ver.txt").Content.Trim() } catch { Start-Sleep -Seconds (5 * $i) }
          }
          Write-Host "ExifTool $ver"
          Fetch "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download" et.zip
          Expand-Archive et.zip et -Force
          $inner = Get-ChildItem et -Directory | Select-Object -First 1
          $dest = "dist/CameraCheck/tools/exiftool"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item (Join-Path $inner.FullName "*") $dest -Recurse -Force
          Rename-Item (Join-Path $dest "exiftool(-k).exe") "exiftool.exe"
          & "$dest/exiftool.exe" -ver
          # sample camera files from the ExifTool test suite, for the smoke test only
          Fetch "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-$ver.tar.gz/download" et.tgz
          tar -xzf et.tgz
          Move-Item "Image-ExifTool-$ver/t/images" samples

      - name: Add launcher notes
        shell: pwsh
        run: |
          Copy-Item README.md dist/CameraCheck/README.md
          @"
          Camera Check - Windows
          ======================
          Created by Emmet Adriaans for Vistek Ltd.

          Double-click CameraCheck.exe. No Python or other installs needed.
          Keep this whole folder together (the exe needs the _internal and tools folders).
          Records are stored in %APPDATA%\CameraCheck.
          "@ | Out-File -Encoding utf8 dist/CameraCheck/START-HERE.txt

      - name: Smoke test the exe
        run: python tools/smoke_test_exe.py dist/CameraCheck/CameraCheck.exe samples

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/CameraCheck -DestinationPath CameraCheck-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CameraCheck-Windows
          path: CameraCheck-Windows.zip

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path camcheck/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release (main branch and version tags)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Camera Check ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: CameraCheck-Windows.zip
          body: |
            **Download `CameraCheck-Windows.zip`**, unzip it anywhere (e.g. Desktop), and double-click `CameraCheck.exe`.
            No Python or other software needed - ExifTool and USB camera support are built in.

            Created by Emmet Adriaans for Vistek Ltd. See CHANGELOG.md for what's new.
